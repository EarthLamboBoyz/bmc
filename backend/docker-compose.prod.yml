version: '3.8'

services:
  # Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: bmc_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bmc_production}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - bmc_network
    # SECURITY: Do NOT expose ports to host in production
    # ports:
    #   - '5432:5432' 

    # Backend Service (Node.js/Express)
  backend:
    build: .
    container_name: bmc_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-bmc_production}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://your-domain.com}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3001:3001' # Expose backend port to be proxied by Nginx
    depends_on:
      - postgres
    networks:
      - bmc_network

networks:
  bmc_network:
    driver: bridge

volumes:
  postgres_data_prod:
